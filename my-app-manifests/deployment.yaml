apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: my-app
  labels:
    app: my-app
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0           # Zero-downtime deployments
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          # Jenkins updates this line automatically in Stage 5
          image: 503884896971.dkr.ecr.us-east-1.amazonaws.com/my-application:14
          imagePullPolicy: Always
          ports:
            - containerPort: 5000

          env:
            - name: APP_ENV
              value: "production"
            - name: APP_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['version']

          # Health checks — Kubernetes uses these to manage pod lifecycle
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          # Resource limits
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true

      # ECR image pull secret (create this manually or via IAM)
      imagePullSecrets:
        - name: ecr-pull-secret

      # Graceful shutdown
      terminationGracePeriodSeconds: 30
